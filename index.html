<title>Прайс-лист — Rewise Studio</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--umbra:#6B4F3A;--umbra2:#8a6548;--linen:#F5F0EA;--graphite:#2C2C2C;--muted:#8a7f78;--border:#e0d9d3;--bg:#faf8f6;--card:#fff;--surface:#f5f0ea}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--graphite);min-height:100vh}

header{background:var(--umbra);padding:20px;text-align:center}
.header-brand{font-size:10px;letter-spacing:3px;color:rgba(245,240,234,.6);text-transform:uppercase;margin-bottom:6px}
.header-title{font-size:22px;font-weight:400;color:var(--linen);margin-bottom:4px}
.header-sub{font-size:13px;color:rgba(245,240,234,.6)}

.container{max-width:800px;margin:0 auto;padding:20px}

.tabs{display:flex;background:var(--card);border:0.5px solid var(--border);border-radius:var(--border-radius-lg, 12px);overflow:hidden;margin-bottom:14px}
.tab{flex:1;padding:13px;font-size:14px;cursor:pointer;color:var(--muted);text-align:center;transition:all .15s;font-family:inherit;background:transparent;border:none}
.tab.active{color:var(--umbra);font-weight:500;background:var(--linen)}

.search-bar{position:relative;margin-bottom:12px}
.search-bar input{width:100%;padding:11px 14px 11px 40px;font-size:14px;border:0.5px solid var(--border);border-radius:12px;background:var(--card);font-family:inherit}
.search-bar input:focus{outline:none;border-color:var(--umbra)}
.search-ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:16px;pointer-events:none}

.dept-filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.df{padding:6px 14px;border-radius:20px;border:0.5px solid var(--border);font-size:12px;color:var(--muted);cursor:pointer;background:transparent;font-family:inherit;transition:all .12s;white-space:nowrap}
.df.active{background:var(--umbra);color:var(--linen);border-color:var(--umbra)}

.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.card{background:var(--card);border:0.5px solid var(--border);border-radius:10px;padding:12px 14px}
.card-name{font-size:13px;color:var(--graphite);margin-bottom:8px;line-height:1.5}
.card-footer{display:flex;justify-content:space-between;align-items:center}
.card-price{font-size:14px;font-weight:500;color:var(--umbra)}
.card-unit{font-size:11px;color:var(--muted)}
.card-approx{font-size:10px;color:var(--umbra);background:var(--linen);padding:2px 6px;border-radius:4px;margin-top:4px;display:inline-block}

.empty{padding:32px;text-align:center;color:var(--muted);font-size:14px;grid-column:1/-1}

.results-count{font-size:12px;color:var(--muted);margin-bottom:10px;padding-left:2px}

footer{text-align:center;padding:24px;color:var(--muted);font-size:12px;margin-top:20px}
footer a{color:var(--umbra);text-decoration:none}

@media(max-width:480px){
  .cards{grid-template-columns:1fr}
  .header-title{font-size:18px}
  .container{padding:12px}
}
</style>
</head>
<body>

<header>
  <div class="header-title">Rewise Studio</div>
  <div class="header-brand">Ремонт та реставрація взуття і сумок</div>
  <div class="header-sub">Прайс-лист послуг</div>
</header>

<div class="container">
  <div class="tabs">
    <button class="tab active" onclick="setCategory('shoes',this)">👟 Взуття</button>
    <button class="tab" onclick="setCategory('bags',this)">👜 Сумки та аксесуари</button>
  </div>

  <div class="search-bar">
    <span class="search-ico">⌕</span>
    <input type="text" id="search" placeholder="Пошук послуги..." oninput="render()">
  </div>

  <div class="dept-filters" id="dept-filters"></div>
  <div class="results-count" id="results-count"></div>
  <div class="cards" id="cards"></div>
</div>

<footer>
  <div>Rewise Studio · Одеса</div>

const DEPT_NAMES = {"cleaning": "Чистка / Базовий догляд", "painting": "Фарбування / Реставрація", "heels": "Каблуки та набійки", "sole": "Підошва", "sewing": "Швейні роботи та деталі", "zippers": "Блискавки", "stretch": "Розтяжка", "hardware": "Фурнітура", "edges": "Реставрація урізів", "handles": "Ручки та ремінь", "lining": "Підкладка", "belt": "Поясний ремінь"};

const SHOES_DEPTS = ["cleaning", "painting", "heels", "sole", "sewing", "zippers", "stretch", "hardware"];
const BAGS_DEPTS = ["cleaning", "painting", "edges", "sewing", "hardware", "zippers", "handles", "lining", "belt"];


let currentCat = 'shoes';
let currentDept = 'all';

function setCategory(cat, btn) {
  currentCat = cat;
  currentDept = 'all';
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('search').value = '';
  renderDeptFilters();
  render();
}

function setDept(dept, btn) {
  currentDept = dept;
  document.querySelectorAll('.df').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function renderDeptFilters() {
  const depts = currentCat === 'shoes' ? SHOES_DEPTS : BAGS_DEPTS;
  const el = document.getElementById('dept-filters');
  el.innerHTML = '';
  const all = document.createElement('button');
  all.className = 'df active';
  all.textContent = 'Усі';
  all.onclick = () => setDept('all', all);
  el.appendChild(all);
  depts.forEach(d => {
    const btn = document.createElement('button');
    btn.className = 'df';
    btn.textContent = DEPT_NAMES[d] || d;
    btn.onclick = () => setDept(d, btn);
    el.appendChild(btn);
  });
}

function render() {
  const q = document.getElementById('search').value.toLowerCase();
  const cat = SERVICES[currentCat] || {};
  const depts = currentCat === 'shoes' ? SHOES_DEPTS : BAGS_DEPTS;
  
  let items = [];
  depts.forEach(dept => {
    if (currentDept !== 'all' && dept !== currentDept) return;
    (cat[dept] || []).forEach(item => {
      if (!q || item.name.toLowerCase().includes(q)) {
        items.push({...item, dept});
      }
    });
  });

  const el = document.getElementById('cards');
  const count = document.getElementById('results-count');
  
  count.textContent = items.length + ' послуг';

  if (!items.length) {
    el.innerHTML = '<div class="empty">Нічого не знайдено</div>';
    return;
  }

  el.innerHTML = items.map(function(item) {
    const priceStr = (item.approx ? "від " : "") + item.price.toLocaleString("uk-UA") + " ₴";
    const approxBadge = item.approx ? "<div class=\"card-approx\">уточнюється після огляду</div>" : "";
    return "<div class=\"card\">" +
      "<div class=\"card-name\">" + item.name + "</div>" +
      approxBadge +
      "<div class=\"card-footer\">" +
        "<span class=\"card-price\">" + priceStr + "</span>" +
        "<span class=\"card-unit\">" + item.unit + "</span>" +
      "</div></div>";
  }).join("");
}

renderDeptFilters();
render();
